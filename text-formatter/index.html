  <style>

    /* ==========================================
       GLOBAL
    ========================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      transition:
        background-color 0.25s ease,
        color 0.25s ease;
    }

    body.light {
      background: #f8fafc;
      color: #0f172a;
    }

    a {
      color: inherit;
    }

    button,
    textarea {
      font-family: inherit;
    }

    /* ==========================================
       LIGHT MODE
    ========================================== */

    body.light .header-inner {
      border-color: #e2e8f0;
    }

    body.light .brand-text h1,
    body.light .page-heading h2,
    body.light .section-title,
    body.light .footer-title,
    body.light .short-info h3,
    body.light .info-card h3,
    body.light .faq-item h3 {
      color: #0f172a;
    }

    body.light .brand-text p,
    body.light .page-heading p,
    body.light .section-description,
    body.light .footer-description,
    body.light .footer-links a,
    body.light .short-info p,
    body.light .info-card p,
    body.light .use-case p,
    body.light .faq-item p,
    body.light .example-description {
      color: #64748b;
    }

    body.light .navigation a {
      color: #334155;
    }

    body.light .navigation a:hover,
    body.light .navigation a.active {
      color: #2563eb;
    }

    body.light .sample-button,
    body.light .theme-button {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }

    body.light .sample-button:hover,
    body.light .theme-button:hover {
      background: #f1f5f9;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    body.light .toolbar,
    body.light .editor,
    body.light .stat-box,
    body.light .short-info,
    body.light .info-card,
    body.light .use-case,
    body.light .example-card,
    body.light .faq-item {
      background: #ffffff;
      border-color: #e2e8f0;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.06);
    }

    body.light .tool-row + .tool-row,
    body.light .editor-top,
    body.light .copyright {
      border-color: #e2e8f0;
    }

    body.light .tool-button {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #1e293b;
    }

    body.light .tool-button:hover {
      background: #e2e8f0;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    body.light #mainText {
      background: #ffffff;
      color: #0f172a;
    }

    body.light #mainText::placeholder {
      color: #94a3b8;
    }

    body.light .stat-value {
      color: #0f172a;
    }

    body.light footer {
      border-color: #e2e8f0;
    }

    body.light .content-divider {
      background: #e2e8f0;
    }

    body.light .example-input {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #334155;
    }

    /* ==========================================
       HEADER
    ========================================== */

    .site-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 20px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 15px;
      background: linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
      );
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .brand-logo span {
      color: white;
      font-size: 27px;
      font-weight: 700;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-text p {
      margin: 4px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      flex-wrap: wrap;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .navigation a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .navigation a:hover,
    .navigation a.active {
      color: #60a5fa;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sample-button,
    .theme-button {
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sample-button {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .theme-button {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* ==========================================
       MAIN
    ========================================== */

    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 20px 60px;
    }

    .page-heading {
      margin-bottom: 24px;
    }

    .page-heading h2 {
      margin: 0;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .page-heading p {
      margin: 10px 0 0;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.7;
      max-width: 760px;
    }

    /* ==========================================
       TOOLBAR
    ========================================== */

    .toolbar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 17px;
      padding: 18px;
    }

    .tool-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .tool-row + .tool-row {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }

    .tool-label {
      width: 62px;
      flex-shrink: 0;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tool-button {
      border: 1px solid #475569;
      background: #334155;
      color: #f1f5f9;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tool-button:hover {
      border-color: #60a5fa;
      background: #3b4b63;
      color: #dbeafe;
    }

    .tool-button:active {
      transform: scale(0.98);
    }

    /* ==========================================
       EDITOR
    ========================================== */

    .editor {
      margin-top: 18px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 17px;
      overflow: hidden;
    }

    .editor-top {
      min-height: 60px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #334155;
    }

    .editor-left,
    .editor-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .editor-button {
      border: 1px solid #475569;
      background: #334155;
      color: #e2e8f0;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .editor-button:hover:not(:disabled) {
      background: #475569;
      border-color: #60a5fa;
      color: #ffffff;
    }

    .editor-button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .editor-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    body.light .editor-button {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #334155;
    }

    body.light .editor-button:hover:not(:disabled) {
      background: #e2e8f0;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    .clear-button {
      border: 0;
      background: transparent;
      color: #fb7185;
      padding: 8px 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .clear-button:hover {
      background: rgba(244, 63, 94, 0.1);
    }

    .copy-button {
      border: 0;
      background: #2563eb;
      color: white;
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .copy-button:hover {
      background: #1d4ed8;
    }

    #mainText {
      width: 100%;
      min-height: 350px;
      padding: 20px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: #1e293b;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.75;
    }

    #mainText::placeholder {
      color: #64748b;
    }

    /* ==========================================
       STATISTICS
    ========================================== */

    .statistics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .stat-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 13px;
      padding: 15px;
    }

    .stat-label {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .stat-value {
      display: block;
      margin-top: 5px;
      color: #f8fafc;
      font-size: 21px;
      font-weight: 700;
    }

    /* ==========================================
       CONTENT SECTIONS
    ========================================== */

    .content-section {
      margin-top: 55px;
    }

    .section-heading {
      margin-bottom: 22px;
    }

    .section-title {
      margin: 0;
      font-size: 27px;
      line-height: 1.3;
      font-weight: 700;
    }

    .section-description {
      margin: 9px 0 0;
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.75;
      max-width: 800px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .info-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 15px;
      padding: 22px;
    }

    .info-card h3 {
      margin: 0 0 9px;
      font-size: 17px;
      line-height: 1.4;
    }

    .info-card p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.75;
    }

    .feature-icon {
      width: 38px;
      height: 38px;
      margin-bottom: 13px;
      border-radius: 10px;
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================
       USE CASES
    ========================================== */

    .use-case-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .use-case {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
    }

    .use-case h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .use-case p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.7;
    }

    /* ==========================================
       EXAMPLES
    ========================================== */

    .example-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .example-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 15px;
      padding: 20px;
    }

    .example-card h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .example-description {
      margin: 0 0 12px;
      color: #94a3b8;
      font-size: 13px;
