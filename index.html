
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Formatter & Cleaner</title>

  <!-- Google Analytics (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4PBH582QW4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-4PBH582QW4');
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* Custom scrollbar for textarea */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: transparent;
    }
    textarea::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.4);
      border-radius: 4px;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background-color: rgba(156, 163, 175, 0.7);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

  <div class="w-full max-w-5xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    
    <!-- Top Bar Header -->
    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 pb-6 border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid font-bold text-lg fa-font"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Text Formatter & Cleaner</h1>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Convert, format, and clean text directly in one place</p>
        </div>
      </div>

      <!-- Quick Action Utility Header Controls -->
      <div class="flex items-center gap-2">
        <button id="sampleBtn" class="px-3 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:border-blue-300 dark:hover:border-blue-500 transition-all shadow-sm flex items-center gap-1.5">
          <i class="fa-solid fa-lightbulb text-amber-500"></i> Sample Text
        </button>
        <button id="themeToggle" class="p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm transition-all">
          <i class="fa-solid fa-moon dark:hidden text-slate-600"></i>
          <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
        </button>
      </div>
    </header>

    <main class="space-y-4">

      <!-- Action Toolbar Box -->
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-2xl p-4 shadow-sm space-y-3">
        
        <!-- Row 1: Text Case Conversions -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider w-full sm:w-auto mr-1">Case:</span>
          
          <button onclick="transformText('sentenceCase')" class="btn-action bg-slate-100 hover:bg-blue-50 dark:bg-slate-700/60 dark:hover:bg-blue-900/30 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 border border-slate-200/80 dark:border-slate-600/50 rounded-xl px-3.5 py-2 text-sm font-semibold transition-all duration-150 flex items-center gap-2 active:scale-95">
            <i class="fa-solid fa-align-left text-xs opacity-70"></i> Sentence Case
          </button>

          <button onclick="transformText('lowercase')" class="btn-action bg-slate-100 hover:bg-blue-50 dark:bg-slate-700/60 dark:hover:bg-blue-900/30 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 border border-slate-200/80 dark:border-slate-600/50 rounded-xl px-3.5 py-2 text-sm font-semibold transition-all duration-150 flex items-center gap-2 active:scale-95">
            <span class="text-xs font-bold opacity-70">aa</span> lowercase
          </button>

          <button onclick="transformText('uppercase')" class="btn-action bg-slate-100 hover:bg-blue-50 dark:bg-slate-700/60 dark:hover:bg-blue-900/30 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 border border-slate-200/80 dark:border-slate-600/50 rounded-xl px-3.5 py-2 text-sm font-semibold transition-all duration-150 flex items-center gap-2 active:scale-95">
            <span class="text-xs font-bold opacity-70">AA</span> UPPERCASE
          </button>

          <button onclick="transformText('capitalizedCase')" class="btn-action bg-slate-100 hover:bg-blue-50 dark:bg-slate-700/60 dark:hover:bg-blue-900/30 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 border border-slate-200/80 dark:border-slate-600/50 rounded-xl px-3.5 py-2 text-sm font-semibold transition-all duration-150 flex items-center gap-2 active:scale-95">
            <span class="text-xs font-bold opacity-70">Aa</span> Capitalized Case
          </button>

          <button onclick="transformText('titleCase')" class="btn-action bg-slate-100 hover:bg-blue-50 dark:bg-slate-700/60 dark:hover:bg-blue-900/30 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 border border-slate-200/80 dark:border-slate-600/50 rounded-xl px-3.5 py-2 text-sm font-semibold transition-all duration-150 flex items-center gap-2 active:scale-95">
            <span class="text-xs font-bold opacity-70">aA</span> Title Case
          </button>
        </div>

        <hr class="border-slate-100 dark:border-slate-700/50 my-2">

        <!-- Row 2: Text Cleaning Operations -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider w-full sm:w-auto mr-1">Clean:</span>

          <button onclick="transformText('removeCommas')" class="btn-action bg-slate-100 hover:bg-emerald-50 dark:bg-slate-700/60 dark:hover:bg-emerald-900/30 text-slate-700 dark:text-slate-200 hover:text-emerald-600 dark:hover:text-emerald-400 border border-slate-200/80 dark:border-slate-600/50 rounded-xl px-3.5 py-2 text-sm font-semibold transition-all duration-150 flex items-center gap-2 active:scale-95">
            <i class="fa-solid fa-ban text-xs opacity-70"></i> Remove Commas
          </button>

          <button onclick="transformText('removeExtraSpaces')" class="btn-action bg-slate-100 hover:bg-emerald-50 dark:bg-slate-700/60 dark:hover:bg-emerald-900/30 text-slate-700 dark:text-slate-200 hover:text-emerald-600 dark:hover:text-emerald-400 border border-slate-200/80 dark:border-slate-600/50 rounded-xl px-3.5 py-2 text-sm font-semibold transition-all duration-150 flex items-center gap-2 active:scale-95">
            <i class="fa-solid fa-compress text-xs opacity-70"></i> Remove Extra Spaces
          </button>
        </div>
      </div>

      <!-- Main Single Text Box Card -->
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm overflow-hidden flex flex-col focus-within:ring-2 focus-within:ring-blue-500/50 transition-all">
        
        <!-- Editor Header Bar (Undo, Redo, Copy, Clear) -->
        <div class="bg-slate-50/80 dark:bg-slate-800/80 px-4 py-2.5 border-b border-slate-200 dark:border-slate-700/80 flex items-center justify-between gap-2 flex-wrap">
          
          <!-- History Actions -->
          <div class="flex items-center gap-1.5">
            <button id="undoBtn" onclick="undo()" disabled title="Undo (Ctrl+Z)" class="px-2.5 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700 rounded-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5">
              <i class="fa-solid fa-rotate-left"></i> Undo
            </button>

            <button id="redoBtn" onclick="redo()" disabled title="Redo (Ctrl+Y)" class="px-2.5 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700 rounded-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5">
              <i class="fa-solid fa-rotate-right"></i> Redo
            </button>
          </div>

          <!-- Utility Clipboard & Clear Actions -->
          <div class="flex items-center gap-2">
            <button onclick="clearText()" title="Clear text" class="px-3 py-1.5 text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-lg transition-all flex items-center gap-1.5 border border-transparent hover:border-rose-200 dark:hover:border-rose-900">
              <i class="fa-solid fa-trash-can"></i> Clear
            </button>

            <button onclick="copyText()" title="Copy text to clipboard" class="px-3.5 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-lg shadow-sm transition-all flex items-center gap-1.5 active:scale-95">
              <i class="fa-regular fa-copy"></i> Copy
            </button>
          </div>
        </div>

        <!-- The Single Text Box -->
        <div class="relative w-full">
          <textarea 
            id="mainText" 
            placeholder="Type or paste your text here to convert and format directly..."
            class="w-full h-80 sm:h-96 p-4 sm:p-5 text-slate-800 dark:text-slate-100 bg-transparent resize-y outline-none font-sans text-base leading-relaxed placeholder-slate-400 dark:placeholder-slate-500 border-none"
            spellcheck="true"
          ></textarea>
        </div>

      </div>

      <!-- Live Text Statistics Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3.5 text-center shadow-sm">
          <span class="block text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Words</span>
          <span id="wordCount" class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white mt-0.5 block">0</span>
        </div>

        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3.5 text-center shadow-sm">
          <span class="block text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Characters</span>
          <span id="charCount" class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white mt-0.5 block">0</span>
        </div>

        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3.5 text-center shadow-sm">
          <span class="block text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Sentences</span>
          <span id="sentenceCount" class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white mt-0.5 block">0</span>
        </div>

        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3.5 text-center shadow-sm">
          <span class="block text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-wider">Reading Time</span>
          <span id="readingTime" class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white mt-0.5 block">0s</span>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-slate-400 dark:text-slate-500">
      <p>Direct live text editor • Press <kbd class="px-1.5 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded text-[10px]">Ctrl+Z</kbd> to undo action</p>
    </footer>

  </div>

  <!-- Toast Notification element -->
  <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 rounded-xl shadow-xl text-sm font-medium transition-all duration-300 flex items-center gap-2 z-50 pointer-events-none">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
    <span id="toastMessage">Text modified</span>
  </div>

  <script>
    // DOM Elements
    const textarea = document.getElementById('mainText');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const wordCountEl = document.getElementById('wordCount');
    const charCountEl = document.getElementById('charCount');
    const sentenceCountEl = document.getElementById('sentenceCount');
    const readingTimeEl = document.getElementById('readingTime');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');

    // Undo/Redo State Management
    let historyStack = [''];
    let historyIndex = 0;
    const MAX_HISTORY = 100;
    let isTypingDebounce = null;

    // Theme Toggle Initialization with Persistence
    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Helper: Flush pending typing debounce into history stack
    function flushTypingBuffer() {
      if (isTypingDebounce !== null) {
        clearTimeout(isTypingDebounce);
        isTypingDebounce = null;
        const currentVal = textarea.value;
        if (historyStack[historyIndex] !== currentVal) {
          if (historyIndex < historyStack.length - 1) {
            historyStack = historyStack.slice(0, historyIndex + 1);
          }
          historyStack.push(currentVal);
          if (historyStack.length > MAX_HISTORY) {
            historyStack.shift();
          } else {
            historyIndex++;
          }
        }
      }
    }

    // Transformation Algorithms
    function toSentenceCase(str) {
      if (!str) return '';
      // Capitalize first letter of each sentence following ., !, or ? or line starts
      return str.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/gm, function(c) {
        return c.toUpperCase();
      });
    }

    function toCapitalizedCase(str) {
      if (!str) return '';
      // Capitalize the first letter of EVERY word
      return str.toLowerCase().replace(/\b\w/g, function(c) {
        return c.toUpperCase();
      });
    }

    function toTitleCase(str) {
      if (!str) return '';
      // Capitalize first letter of words following minor word guidelines
      const minorWords = new Set(['a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'if', 'in', 'nor', 'of', 'on', 'or', 'so', 'the', 'to', 'up', 'yet', 'with']);
      return str.toLowerCase().replace(/(?:[^\s\-/\u2014]+)/g, (word, index, fullStr) => {
        if (index === 0 || !minorWords.has(word)) {
          return word.charAt(0).toUpperCase() + word.slice(1);
        }
        return word;
      });
    }

    function removeCommas(str) {
      return str.replace(/,/g, '');
    }

    function removeExtraSpaces(str) {
      if (!str) return '';
      // Remove multiple spaces/tabs while preserving sentence spacing and line structure
      return str
        .split('\n')
        .map(line => line.replace(/[ \t]+/g, ' ').trim())
        .join('\n')
        .replace(/\n{3,}/g, '\n\n');
    }

    // Main Transformation Dispatcher
    function transformText(actionType) {
      flushTypingBuffer();
      const currentText = textarea.value;
      if (!currentText && actionType !== 'clear') {
        showToast('Text box is empty', 'fa-circle-info', 'text-amber-400');
        return;
      }

      let newText = currentText;
      let actionLabel = '';

      switch (actionType) {
        case 'sentenceCase':
          newText = toSentenceCase(currentText);
          actionLabel = 'Converted to Sentence Case';
          break;
        case 'lowercase':
          newText = currentText.toLowerCase();
          actionLabel = 'Converted to lowercase';
          break;
        case 'uppercase':
          newText = currentText.toUpperCase();
          actionLabel = 'Converted to UPPERCASE';
          break;
        case 'capitalizedCase':
          newText = toCapitalizedCase(currentText);
          actionLabel = 'Converted to Capitalized Case';
          break;
        case 'titleCase':
          newText = toTitleCase(currentText);
          actionLabel = 'Converted to Title Case';
          break;
        case 'removeCommas':
          newText = removeCommas(currentText);
          actionLabel = 'Removed all commas';
          break;
        case 'removeExtraSpaces':
          newText = removeExtraSpaces(currentText);
          actionLabel = 'Removed extra spaces';
          break;
      }

      if (newText !== currentText) {
        pushState(newText);
        showToast(actionLabel, 'fa-wand-magic-sparkles', 'text-blue-400');
      } else {
        showToast('No changes needed', 'fa-circle-info', 'text-slate-400');
      }
    }

    // History & Undo / Redo Functions
    function pushState(newText) {
      // Guard against identical duplicate state entries
      if (historyStack[historyIndex] === newText) {
        return;
      }

      // Truncate any redo history if new action performed
      if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
      }

      historyStack.push(newText);
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      } else {
        historyIndex++;
      }

      textarea.value = newText;
      updateUI();
    }

    function undo() {
      flushTypingBuffer();
      if (historyIndex > 0) {
        historyIndex--;
        textarea.value = historyStack[historyIndex];
        updateUI();
        showToast('Undone action', 'fa-rotate-left', 'text-blue-400');
      }
    }

    function redo() {
      flushTypingBuffer();
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        textarea.value = historyStack[historyIndex];
        updateUI();
        showToast('Redone action', 'fa-rotate-right', 'text-blue-400');
      }
    }

    function clearText() {
      flushTypingBuffer();
      if (!textarea.value) return;
      pushState('');
      showToast('Text cleared', 'fa-trash-can', 'text-rose-400');
    }

    // Clipboard Copy
    function copyText() {
      const textToCopy = textarea.value;
      if (!textToCopy) {
        showToast('Nothing to copy', 'fa-circle-exclamation', 'text-amber-400');
        return;
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast('Copied to clipboard!', 'fa-circle-check', 'text-emerald-400');
        }).catch(() => fallbackCopy(textToCopy));
      } else {
        fallbackCopy(textToCopy);
      }
    }

    function fallbackCopy(text) {
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Copied to clipboard!', 'fa-circle-check', 'text-emerald-400');
      } catch (err) {
        showToast('Failed to copy', 'fa-circle-xmark', 'text-rose-400');
      }
    }

    // Toast Notification Display
    let toastTimeout = null;
    function showToast(message, iconClass = 'fa-circle-check', iconColor = 'text-emerald-400') {
      clearTimeout(toastTimeout);
      toastMessage.textContent = message;
      toastIcon.className = `fa-solid ${iconClass} ${iconColor}`;
      
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2200);
    }

    // Live Text Statistics Calculator
    function calculateStats(text) {
      const trimmed = text.trim();
      
      // Word count
      const words = trimmed ? trimmed.split(/\s+/).length : 0;
      
      // Character count
      const chars = text.length;

      // Sentence count
      const sentences = trimmed ? (trimmed.match(/[^.!?]+[.!?]+/g) || [trimmed]).length : 0;

      // Reading time (average 200 words per minute)
      const wpm = 200;
      const totalSeconds = Math.ceil((words / wpm) * 60);
      let timeFormatted = '0s';
      if (totalSeconds >= 60) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        timeFormatted = `${mins}m ${secs}s`;
      } else {
        timeFormatted = `${totalSeconds}s`;
      }

      return { words, chars, sentences, timeFormatted };
    }

    function updateUI() {
      // Update statistics
      const stats = calculateStats(textarea.value);
      wordCountEl.textContent = stats.words.toLocaleString();
      charCountEl.textContent = stats.chars.toLocaleString();
      sentenceCountEl.textContent = stats.sentences.toLocaleString();
      readingTimeEl.textContent = stats.timeFormatted;

      // Enable/disable undo/redo buttons
      undoBtn.disabled = historyIndex <= 0;
      redoBtn.disabled = historyIndex >= historyStack.length - 1;
    }

    // Event Listeners for Manual Typing Input
    textarea.addEventListener('input', () => {
      updateUI();
      
      // Debounce typing entries to history stack
      clearTimeout(isTypingDebounce);
      isTypingDebounce = setTimeout(() => {
        if (historyStack[historyIndex] !== textarea.value) {
          // Push new typing state
          if (historyIndex < historyStack.length - 1) {
            historyStack = historyStack.slice(0, historyIndex + 1);
          }
          historyStack.push(textarea.value);
          if (historyStack.length > MAX_HISTORY) historyStack.shift();
          else historyIndex++;
          updateUI();
        }
      }, 750);
    });

    // Keyboard Shortcuts (Ctrl+Z / Cmd+Z, Ctrl+Y / Cmd+Shift+Z)
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        if (e.shiftKey) {
          e.preventDefault();
          redo();
        } else {
          e.preventDefault();
          undo();
        }
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redo();
      }
    });

    // Sample Text Loader
    document.getElementById('sampleBtn').addEventListener('click', () => {
      flushTypingBuffer();
      const sample = "hello world! THIS IS A SAMPLE TEXT, meant to demonstration how easy it is to convert text. it includes EXTRA    SPACES, mixed cases, and commas, which can all be cleaned with a single click.";
      pushState(sample);
      showToast('Loaded sample text', 'fa-lightbulb', 'text-amber-400');
    });

    // Initial setup
    updateUI();
  </script>
</body>
</html>
